name: BashX
options:
  bundleIdPrefix: com.bashx
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO
packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: "5.0.0"
targets:
  BashXTunHelper:
    type: tool
    platform: macOS
    sources:
      - TunHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bashx.tunhelper
        PRODUCT_NAME: BashXTunHelper
        SKIP_INSTALL: true
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        MARKETING_VERSION: "0.1.56"
        CURRENT_PROJECT_VERSION: "56"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_HARDENED_RUNTIME: true
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH: NO

  BashX:
    type: application
    platform: macOS
    sources:
      - BashX
      - path: Shared/Paths.swift
      - path: Shared/ByteFormat.swift
      - path: Shared/SettingsStore.swift
      - path: Shared/GoogleReliability.swift
      - path: Resources/rules
        buildPhase: resources
        type: folder
      - path: Resources/Core
        buildPhase: resources
        type: folder
    preBuildScripts:
      - name: Bundle Mihomo Core
        script: |
          chmod +x "${SRCROOT}/scripts/fetch_mihomo.sh"
          "${SRCROOT}/scripts/fetch_mihomo.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bashx.app
        INFOPLIST_FILE: BashX/Info.plist
        CODE_SIGN_ENTITLEMENTS: BashX/BashX.entitlements
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        PRODUCT_NAME: BashX
        MARKETING_VERSION: "0.1.56"
        CURRENT_PROJECT_VERSION: "56"
        ENABLE_HARDENED_RUNTIME: true
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH: NO
    dependencies:
      - package: Yams
      - target: BashXTunHelper
        embed: true
        link: false
        codeSign: true
    info:
      path: BashX/Info.plist
      properties:
        CFBundleName: BashX
        CFBundleDisplayName: BashX
        CFBundleShortVersionString: "0.1.56"
        CFBundleVersion: "56"
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  BashXiOS:
    type: application
    platform: iOS
    sources:
      - BashXiOS
      - Shared
      - path: BashX/Models/Models.swift
      - path: BashX/Services/ClashConfigParser.swift
      - path: BashX/Services/SubscriptionFetcher.swift
      - path: BashX/Services/SpeedTester.swift
      - path: BashX/Services/NodeCategory.swift
      - path: BashX/Services/ChinaSmartRules.swift
      - path: BashX/Services/GeoSiteRules.swift
      - path: BashX/Services/VideoAdBlock.swift
      - path: BashX/Services/RuntimeRules.swift
      - path: BashX/Services/IosProxyDomains.swift
      - path: BashX/Services/IosDirectDomains.swift
      - path: BashX/Services/DnsProfile.swift
      - path: BashX/Services/TelegramReliability.swift
      - path: BashX/Services/LogoStyle.swift
      - path: Resources/rules
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bashx.app.ios
        INFOPLIST_FILE: BashXiOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: BashXiOS/BashXiOS.entitlements
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_NAME: BashX
        MARKETING_VERSION: "0.1.56"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        DEVELOPMENT_TEAM: NFYZYS2VLL
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: BashX
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    dependencies:
      - package: Yams
      - target: PacketTunnel
        embed: true
      - target: BashXControls
        embed: true
    info:
      path: BashXiOS/Info.plist
      properties:
        CFBundleDisplayName: BashX
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIImageRespectsSafeAreaInsets: true
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Alternate icons: ONLY from Assets.xcassets AppIcon-*
        # (ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS). Manual CFBundleAlternateIcons
        # with CFBundleIconFiles expects loose PNGs and blanks the home-screen tile.

  BashXControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - BashXControls
      - path: Shared/AppConstants.swift
      - path: Shared/Paths.swift
      - path: Shared/MihomoConfigCheck.swift
      - path: Shared/VPNQuickControl.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bashx.app.ios.Controls
        INFOPLIST_FILE: BashXControls/Info.plist
        CODE_SIGN_ENTITLEMENTS: BashXControls/BashXControls.entitlements
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_NAME: BashXControls
        MARKETING_VERSION: "0.1.56"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        DEVELOPMENT_TEAM: NFYZYS2VLL
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: BashXControls/Info.plist
      properties:
        CFBundleDisplayName: BashX 控制
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
      - path: Shared/AppConstants.swift
      - path: Shared/Paths.swift
      - path: Shared/TunnelDiagnostics.swift
    configFiles:
      Debug: PacketTunnel/PacketTunnel.xcconfig
      Release: PacketTunnel/PacketTunnel.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bashx.app.ios.PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_NAME: PacketTunnel
        MARKETING_VERSION: "0.1.56"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        DEVELOPMENT_TEAM: NFYZYS2VLL
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
    dependencies:
      - framework: Framework/MihomoCore.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: BashX Tunnel
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
